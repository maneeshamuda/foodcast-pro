name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.11", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Train (quick) so API tests have an artifact
        run: python -m fdf.train --quick
        env: {FDF_ARTIFACT: /tmp/ci_bundle.joblib}
      - run: pytest -q
        env: {FDF_ARTIFACT: /tmp/ci_bundle.joblib}
